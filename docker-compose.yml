name: marketsense

services:
  db:
    image: postgres:15
    container_name: marketsense-db-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: marketsense_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: marketsense-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
