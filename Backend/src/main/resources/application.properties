spring.application.name=demo
spring.datasource.url= ${SPRING_DATASOURCE_URL}
spring.datasource.username= ${SPRING_DATASOURCE_USERNAME}
spring.datasource.password= ${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.config.import=optional:file:.env[.properties]
server.error.include-message=always
server.error.include-binding-errors=always

security.jwt.secret-key= ${JWT_SECRET_KEY}
security.jwt.expiration-time=604800000

finnhub.api-key= ${FINNHUB_API_KEY}
gemini.api-key= ${GEMINI_API_KEY}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.thymeleaf.check-template-location=false

digest.enabled=${DIGEST_ENABLED:true}
digest.cron=${DIGEST_CRON:0 0 8 * * MON-FRI}
digest.zone=${DIGEST_ZONE:Asia/Singapore}
digest.from=${MAIL_FROM:MarketSense <digest@marketsense.local>}
digest.base-url=${APP_BASE_URL:http://localhost:8080}
digest.frontend-url=${FRONTEND_URL:http://localhost:5173}
digest.symbol-delay-ms=${DIGEST_SYMBOL_DELAY_MS:2000}