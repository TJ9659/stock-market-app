<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Verify your MarketSense email</title>
</head>
<body style="margin:0;padding:0;background-color:#0b0e11;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0b0e11" style="background-color:#0b0e11;">
  <tr>
    <td align="center" style="padding:28px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
             style="max-width:520px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e5e7eb;">
        <tr>
          <td style="padding:0 4px 20px;">
            <div style="font-size:22px;font-weight:900;letter-spacing:-0.5px;color:#ffffff;">Market<span style="color:#10b981;">Sense</span></div>
          </td>
        </tr>
        <tr>
          <td>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#161616"
                   style="background-color:#161616;border:1px solid #27272a;border-radius:12px;">
              <tr>
                <td style="padding:28px 24px;">
                  <h1 style="margin:0 0 12px;font-size:20px;color:#ffffff;">Confirm your email</h1>
                  <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#d1d5db;">
                    <span th:text="${firstName != null} ? |Hi ${firstName},| : 'Hi,'">Hi,</span>
                    click the button below to verify your email and finish setting up your account.
                  </p>
                  <a th:href="${verifyUrl}"
                     style="display:inline-block;padding:12px 22px;border-radius:10px;background-color:#10b981;color:#000000;font-size:14px;font-weight:800;text-decoration:none;">Verify email</a>
                  <p style="margin:24px 0 0;font-size:12px;line-height:1.6;color:#9ca3af;">
                    Or paste this link into your browser:<br>
                    <a th:href="${verifyUrl}" th:text="${verifyUrl}" style="color:#9ca3af;word-break:break-all;">link</a>
                  </p>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 4px 0;font-size:11px;line-height:1.6;color:#6b7280;">
            <span th:text="|This link expires in ${expiresIn}.|">This link expires in 24 hours.</span>
            If you didn't create a MarketSense account, you can ignore this email.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
